description: Module is a vertically integrated sustainable housing company that designs, manufactures,
  and builds modular homes. Operating across design (architecture and engineering with BIM), manufacturing
  (its Last Mile Facility in Pittsburgh), and construction (licensed general contracting), Module focuses
  on infill and "missing middle" housing, small-footprint and energy-efficient affordable homes, and
  mixed-income developments through its Last Mile Network of design, construction, and mission-driven
  developer partner programs. Surfaced as a Techstars portfolio company and enriched in the API Evangelist
  network; Module publishes no public API, developer portal, or technical documentation surface.
